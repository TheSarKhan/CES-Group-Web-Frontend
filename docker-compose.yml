# Serverdə: /var/www/cesgroup — host-dakı nginx cesgroup.az → 127.0.0.1:3010
services:
  cesgroup-frontend:
    build:
      context: .
      # build konteyneri ana maşının şəbəkəsini işlədir ki, səhifələr yığılarkən backend-dən məzmun oxusun
      network: host
      args:
        BACKEND_URL: http://127.0.0.1:8080
        NEXT_PUBLIC_SITE_URL: https://cesgroup.az
        # Serverdəki .env faylından oxunur (docker compose bunu build zamanı avtomatik əvəz edir)
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    image: cesgroup-frontend
    container_name: cesgroup-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      # Müraciət formu və admin panel Spring backend-ə Equipment şəbəkəsi vasitəsilə çatır
      BACKEND_URL: http://ces-backend:8080
    ports:
      - "127.0.0.1:3010:3000"
    networks:
      - default
      - ces-net

networks:
  ces-net:
    external: true
    name: ces_ces-net
