# admin.cesgroup.az: admin panel (cesgroup-frontend konteyneri, Host başlığına görə /adm seçilir).
# Serverdə: /etc/nginx/sites-available/cesgroup-admin.conf (sites-enabled-ə link).
# Qurulum ardıcıllığı deploy/DEPLOY-ADMIN.md faylındadır; SSL sertifikatı DNS qeydi yaranandan sonra
# `certbot certonly --nginx -d admin.cesgroup.az` ilə alınır.

server {
    listen 80;
    listen [::]:80;
    server_name admin.cesgroup.az;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.cesgroup.az;

    ssl_certificate /etc/letsencrypt/live/admin.cesgroup.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.cesgroup.az/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 1M;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
