# CES Group subdomain-ləri. Serverdə: /etc/nginx/sites-available/cesgroup-subdomains.conf
# SSL: DNS qeydləri qurulandan sonra
#   certbot --nginx -d equipment.cesgroup.az -d architect.cesgroup.az -d construction.cesgroup.az --redirect

# --- CES Equipment: mövcud ces tətbiqi (frontend :3000, backend :8080). Köhnə ces.com.az ona 301 ilə yönləndirilir ---
server {
    listen 80;
    listen [::]:80;
    server_name equipment.cesgroup.az;

    client_max_body_size 25M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;

    location /uploads/ {
        alias /var/www/ces/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        try_files $uri @backend;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @backend {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- CES Construction və Farmart: cesgroup.az tətbiqinin özündədir (cesgroup-frontend konteyneri, 127.0.0.1:3010) ---
# Tətbiqdəki src/proxy.ts Host başlığına görə /s/construction və /s/farmart marşrutlarını seçir,
# ona görə Host mütləq olduğu kimi ötürülməlidir. Əlaqə formasının /api/contact sorğusu da buradan keçir.
server {
    listen 80;
    listen [::]:80;
    server_name construction.cesgroup.az farmart.cesgroup.az;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    add_header X-Content-Type-Options nosniff always;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- CES Architecture: Next.js konteyneri (/var/www/ces-architect, 127.0.0.1:3011) ---
# Repo: TheSarKhan/CESArchitectureFront (CI/CD ilə deploy olunur). Backend yoxdur, ona görə /admin bağlıdır.
server {
    listen 80;
    server_name architect.cesgroup.az;

    location ^~ /admin { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
