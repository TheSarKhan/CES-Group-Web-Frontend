<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>CES Group — tezliklə</title>
<style>
  :root { --ink:#1e1e21; --paper:#f6f5f1; --gold:#c9a24b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100svh; display:grid; place-items:center; padding:24px; background:var(--ink); color:var(--paper);
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align:center; }
  main { max-width:520px; }
  .mark { width:32px; height:32px; margin:0 auto 28px; border-radius:5px; background:var(--paper); display:grid; place-items:center; }
  .mark i { width:13px; height:13px; background:var(--gold); }
  h1 { margin:0 0 12px; font-size:clamp(34px,6vw,52px); font-weight:500; letter-spacing:-0.03em; }
  p { margin:0 0 28px; color:#b8b4ab; line-height:1.6; }
  a { color:var(--paper); text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:6px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true"><i></i></div>
  <h1>Tezliklə</h1>
  <p>Bu səhifə hazırlanır.</p>
  <a href="https://cesgroup.az">CES Group ana səhifəsi</a>
</main>
</body>
</html>
